# SPA fallback: client-side routes like /songs/123 must serve index.html
# on refresh/deep link. Real files (JS/CSS/assets) are served as-is.
# /api is never routed here — traefik sends it to the api container.
server {
  listen 80;
  root /usr/share/nginx/html;
  include /etc/nginx/mime.types;

  location / {
    try_files $uri /index.html;
  }
}
