# CI for every PR and every push to master. One job: for a repo this size,
# job startup costs more than the steps themselves, so a single sequential
# job is faster than parallel lint/typecheck/test jobs.
name: CI

on:
  pull_request:
  push:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    # Integration tests (auth routes) need a live Postgres. Migrations are
    # applied by the tests themselves (drizzle migrator), no extra step.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: opensetlist
          POSTGRES_PASSWORD: opensetlist
          POSTGRES_DB: opensetlist
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U opensetlist -d opensetlist"
          --health-interval 2s
          --health-timeout 3s
          --health-retries 15
    env:
      DATABASE_URL: postgres://opensetlist:opensetlist@localhost:5432/opensetlist
    steps:
      - uses: actions/checkout@v5

      # Reads the pnpm version from package.json's packageManager field.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      - name: Build
        run: pnpm -C web build
